name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}
        # GitHub-hosted runners only: on a public repository, a pull request from a fork must
        # never run on a self-hosted machine.
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Symfony 8 requires PHP 8.4.
                    - { php: '8.3', symfony: '7.4.*', code-quality: true }
                    - { php: '8.4', symfony: '8.*' }
                    - { php: '8.5', symfony: '8.*' }
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2, flex

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer update --no-interaction --no-progress --prefer-dist
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}

            - name: Code style
              if: matrix.code-quality
              run: composer run --no-interaction code-quality

            - name: PHPStan
              run: composer run --no-interaction phpstan

            - name: PHPUnit
              run: composer run --no-interaction tests
